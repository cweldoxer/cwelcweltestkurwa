
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>q0pe</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f4f4f4;
    text-align:center;
}

header{
    background:#222;
    color:white;
    padding:30px;
}

section{
    padding:40px 20px;
}

img{
    max-width:90%;
    border-radius:10px;
    margin:20px 0;
}

.box{
    background:white;
    max-width:800px;
    margin:auto;
    padding:20px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

footer{
    background:#222;
    color:white;
    padding:15px;
    margin-top:40px;
}

/* licznik */
#counter{
    position:fixed;
    top:10px;
    right:10px;
    background:#000;
    color:#fff;
    padding:8px 12px;
    border-radius:8px;
    font-size:14px;
}

/* zakładki */

.tabs{
    margin-top:20px;
}

.tabs button{
    padding:10px 20px;
    margin:5px;
    border:none;
    background:#333;
    color:white;
    cursor:pointer;
    border-radius:6px;
}

.tabs button:hover{
    background:#555;
}

.tab{
    display:none;
}

.tab.active{
    display:block;
}

</style>
</head>

<body>

<div id="counter">Odwiedziny: ...</div>

<header>
<h1>q0pe</h1>
<p>Ty też tu jesteś?</p>
</header>

<div class="tabs">
<button onclick="openTab('tab1')">Zakładka 1</button>
<button onclick="openTab('tab2')">Zakładka 2</button>
</div>

<!-- ZAKŁADKA 1 -->
<section id="tab1" class="tab active">
<div class="box">

<h2>Tytuł zdjęcia</h2>
<p>Opis zdjęcia</p>

<img src="LINK_DO_ZDJECIA">

<p>Dodatkowy opis</p>

</div>
</section>

<!-- ZAKŁADKA 2 -->
<section id="tab2" class="tab">
<div class="box">

<h2>Tytuł 2</h2>
<p>Opis drugiego zdjęcia</p>

<img src="LINK_DO_ZDJECIA2">

<p>Dowolny tekst</p>

</div>
</section>

<footer>
<p>buziaczki</p>
</footer>

<script>

/* zakładki */

function openTab(tabId){

document.querySelectorAll(".tab").forEach(tab=>{
tab.classList.remove("active")
})

document.getElementById(tabId).classList.add("active")

}

/* licznik */

const namespace = "q0pe-site"
const key = "visits"

if(!localStorage.getItem("visited")){

fetch(`https://api.countapi.xyz/hit/${namespace}/${key}`)
.then(res => res.json())
.then(res => {
document.getElementById("counter").innerText = "Odwiedziny: " + res.value
})

localStorage.setItem("visited","true")

}else{

fetch(`https://api.countapi.xyz/get/${namespace}/${key}`)
.then(res => res.json())
.then(res => {
document.getElementById("counter").innerText = "Odwiedziny: " + res.value
})

}

</script>

</body>
</html>
